<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transport E-Way Bill QR Generator</title>
    <!-- Modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-elements">
        <svg class="diagonal-wave" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M 0,100 C 20,70 50,70 100,0 L 100,100 Z" fill="#e0e7ff" />
            <path d="M 0,100 C 30,90 70,30 100,0 L 100,100 Z" fill="#dbeafe" opacity="0.6" />
            <path d="M 0,100 C 40,95 80,40 100,0 L 100,100 Z" fill="#bfdbfe" opacity="0.4" />
        </svg>
    </div>
    
    <div class="container">
        <header>
            <h1>E-Way Bill QR Generator</h1>
            <p>Generate precise static offline QR codes for transport compliance.</p>
        </header>

        <main class="glass-panel">
            <form id="qr-form">
                <div class="input-group">
                    <label for="rawString">Raw E-Way Bill String</label>
                    <textarea id="rawString" name="rawString" required placeholder="e.g. PRN,PG-1AS2F8|PC,84L|LN,|CSE,M/S KUNDU TRADERS |COM,JUTE`QTWT,104.0`VAL,1700000`MKTFE,17000.00`|VN,WB51F0494|TN,|TCN,|VD,25-07-2026 07:37:43|PD,23-07-2026 07:37:43|PT,SPOT|" rows="8"></textarea>
                </div>

                <button type="submit" id="generate-btn">
                    <span class="btn-text">Generate QR Code</span>
                    <div class="spinner-container hidden" id="loading-spinner">
                        <div class="spinner"></div>
                        <span class="loading-text">Waking up server... (may take up to 40s)</span>
                    </div>
                </button>
            </form>

            <div id="result-section" class="hidden">
                <div class="qr-container">
                    <img id="qr-image" src="" alt="Generated QR Code">
                </div>
                <div class="actions">
                    <button id="download-btn" class="secondary-btn">Download QR Code</button>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
